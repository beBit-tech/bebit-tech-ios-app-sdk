name: Update test app after published SDK release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.WORKFLOW_TRIGGER_TOKEN }}
      SDK_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Wait for the SDK asset and request an update PR
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo '::error::WORKFLOW_TRIGGER_TOKEN is required'; exit 1; }
          # A release may be published before its binary upload finishes.
          ready=false
          for attempt in $(seq 1 60); do
            count=$(gh release view "$SDK_VERSION" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[] | select(.name == "OmniSegmentKit.xcframework.zip" and .size > 0 and .state == "uploaded")] | length')
            if [ "$count" = 1 ]; then ready=true; break; fi
            sleep 10
          done
          "$ready" || { echo '::error::Published release has no uploaded XCFramework asset'; exit 1; }
          gh workflow run app-update.yml --repo beBit-tech/test-ios-app --ref main -f "version=$SDK_VERSION"
